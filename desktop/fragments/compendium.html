            <section class="desktop-view desktop-compendium-view" data-view-panel="compendium">
                <aside class="desktop-compendium-sidebar">
                    <div>
                        <p class="desktop-section-kicker">Knowledge Base</p>
                        <h2>资料库</h2>
                        <p data-compendium-project-label>从书库打开项目后编辑资料。</p>
                    </div>
                    <div class="desktop-compendium-tools">
                        <input type="search" data-compendium-search placeholder="搜索标题、标签、正文">
                        <select data-compendium-type>
                            <option value="">全部类型</option>
                            <option value="character">角色</option>
                            <option value="location">地点</option>
                            <option value="organization">组织</option>
                            <option value="item">物品</option>
                            <option value="lore">设定</option>
                            <option value="timeline">时间线</option>
                            <option value="note">笔记</option>
                        </select>
                        <button class="desktop-secondary-action" type="button" data-compendium-draw>抽卡</button>
                        <button class="desktop-primary-action" type="button" data-compendium-new>新资料</button>
                    </div>
                    <div class="desktop-compendium-status" data-compendium-status>未打开项目</div>
                    <div class="desktop-compendium-list" data-compendium-list></div>
                </aside>
                <section class="desktop-compendium-editor">
                    <div class="desktop-compendium-editor-empty" data-compendium-editor-empty>
                        <div class="desktop-compendium-empty-content">
                            <p class="desktop-compendium-empty-icon">&#128214;</p>
                            <h3 data-compendium-empty-title>选择资料条目</h3>
                            <p data-compendium-empty-desc>从左侧列表中选择资料卡进行编辑，或新建资料。</p>
                        </div>
                    </div>
                    <form data-compendium-form hidden>
                        <header class="desktop-compendium-editor-header">
                            <div>
                                <p class="desktop-section-kicker">资料编辑</p>
                                <h2 data-compendium-editor-title>选择资料条目</h2>
                            </div>
                            <div class="desktop-native-editor-actions">
                                <button class="desktop-secondary-action" type="button" data-compendium-ai-rewrite disabled>AI 重写</button>
                                <button class="desktop-secondary-action" type="button" data-compendium-delete disabled>删除</button>
                                <button class="desktop-primary-action" type="submit" data-compendium-save disabled>保存资料</button>
                            </div>
                        </header>
                        <div class="desktop-compendium-form-grid">
                            <p class="desktop-compendium-section-heading">资料内容</p>
                            <label>
                                <span>类型</span>
                                <select data-compendium-entry-type disabled>
                                    <option value="character">角色</option>
                                    <option value="location">地点</option>
                                    <option value="organization">组织</option>
                                    <option value="item">物品</option>
                                    <option value="lore">设定</option>
                                    <option value="timeline">时间线</option>
                                    <option value="note">笔记</option>
                                </select>
                            </label>
                            <label>
                                <span>标题</span>
                                <input type="text" data-compendium-title maxlength="160" disabled>
                            </label>
                            <label class="desktop-form-wide">
                                <span>摘要</span>
                                <input type="text" data-compendium-summary maxlength="300" disabled>
                            </label>
                            <label>
                                <span>标签</span>
                                <input type="text" data-compendium-tags placeholder="逗号分隔" disabled>
                            </label>
                            <label>
                                <span>别名</span>
                                <input type="text" data-compendium-aliases placeholder="逗号分隔" disabled>
                            </label>
                            <p class="desktop-compendium-section-heading">写作上下文 · 注入策略</p>
                            <label class="desktop-settings-check">
                                <input type="checkbox" data-compendium-always disabled>
                                <span>默认加入生成上下文</span>
                            </label>
                            <fieldset class="desktop-compendium-policy" data-compendium-policy>
                                <legend>注入策略</legend>
                                <label>
                                    <span>模式</span>
                                    <select data-compendium-policy-mode disabled>
                                        <option value="disabled">不自动注入</option>
                                        <option value="manual">仅手动/明确提及</option>
                                        <option value="mention">提及时注入</option>
                                        <option value="auto">条件自动注入</option>
                                        <option value="always">总是注入</option>
                                    </select>
                                </label>
                                <div class="desktop-compendium-triggers">
                                    <label class="desktop-settings-check">
                                        <input type="checkbox" data-compendium-trigger-title disabled>
                                        <span>标题</span>
                                    </label>
                                    <label class="desktop-settings-check">
                                        <input type="checkbox" data-compendium-trigger-aliases disabled>
                                        <span>别名</span>
                                    </label>
                                    <label class="desktop-settings-check">
                                        <input type="checkbox" data-compendium-trigger-tags disabled>
                                        <span>标签</span>
                                    </label>
                                    <label class="desktop-settings-check">
                                        <input type="checkbox" data-compendium-trigger-pov disabled>
                                        <span>POV 人物匹配</span>
                                    </label>
                                    <label class="desktop-settings-check">
                                        <input type="checkbox" data-compendium-trigger-scene-characters disabled>
                                        <span>场景人物匹配</span>
                                    </label>
                                </div>
                            </fieldset>
                            <fieldset class="desktop-compendium-character" data-compendium-character hidden>
                                <legend>人物约束</legend>
                                <label>
                                    <span>角色定位</span>
                                    <input type="text" data-compendium-character-role maxlength="200" disabled>
                                </label>
                                <label>
                                    <span>目标</span>
                                    <input type="text" data-compendium-character-goal maxlength="200" disabled>
                                </label>
                                <label>
                                    <span>动机</span>
                                    <input type="text" data-compendium-character-motivation maxlength="200" disabled>
                                </label>
                                <label>
                                    <span>冲突</span>
                                    <input type="text" data-compendium-character-conflict maxlength="200" disabled>
                                </label>
                                <label>
                                    <span>语气/声音</span>
                                    <input type="text" data-compendium-character-voice maxlength="200" disabled>
                                </label>
                                <label>
                                    <span>当前状态</span>
                                    <input type="text" data-compendium-character-current-state maxlength="300" disabled>
                                </label>
                                <label>
                                    <span>已知信息</span>
                                    <input type="text" data-compendium-character-knowledge maxlength="300" disabled>
                                </label>
                                <label>
                                    <span>关系备注</span>
                                    <input type="text" data-compendium-character-relationship maxlength="300" disabled>
                                </label>
                            </fieldset>
                            <label class="desktop-form-wide">
                                <span>正文</span>
                                <textarea data-compendium-body spellcheck="false" disabled></textarea>
                            </label>
                        </div>
                    </form>
                </section>
            </section>
