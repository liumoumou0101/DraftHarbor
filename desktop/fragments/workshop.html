            <section class="desktop-view desktop-workshop-view" data-view-panel="workshop">
                <aside class="desktop-workshop-sidebar">
                    <div class="desktop-workshop-sidebar-head">
                        <p data-workshop-project-label>从书库打开项目后开始讨论。</p>
                        <p class="desktop-workshop-status" data-workshop-status>未打开项目</p>
                    </div>
                    <div class="desktop-workshop-project-summary" data-workshop-project-summary hidden>
                        <p class="desktop-workshop-project-summary-label">作品</p>
                        <h3 data-workshop-project-name></h3>
                        <p data-workshop-project-stats></p>
                    </div>
                    <button class="desktop-primary-action" type="button" data-workshop-new>新对话</button>
                    <div class="desktop-workshop-session-list" data-workshop-session-list></div>
                </aside>
                <section class="desktop-workshop-chat">
                    <header class="desktop-workshop-chat-header">
                        <div>
                            <h2 data-workshop-title>选择或新建对话</h2>
                        </div>
                        <div class="desktop-workshop-chat-actions">
                            <label class="desktop-workshop-template">
                                <span>角度</span>
                                <select data-workshop-template aria-label="讨论角度"></select>
                            </label>
                            <div class="desktop-workshop-more-wrap">
                                <button class="desktop-secondary-action" type="button" data-workshop-more aria-haspopup="menu" aria-expanded="false">更多</button>
                                <div class="desktop-workshop-more-menu" data-workshop-more-menu hidden role="menu">
                                    <button class="desktop-workshop-more-item" type="button" data-workshop-contract-toggle role="menuitem">会话指令</button>
                                    <button class="desktop-workshop-more-item" type="button" data-workshop-delete role="menuitem" disabled>删除对话</button>
                                </div>
                                <div class="desktop-workshop-contract-popover" data-workshop-contract-panel hidden>
                                    <p class="desktop-workshop-contract-label">本会话指令</p>
                                    <label class="desktop-native-writer-check">
                                        <input type="checkbox" data-workshop-contract-enabled>
                                        <span>启用</span>
                                    </label>
                                    <textarea data-workshop-contract-content rows="3" placeholder="只用于这次讨论，例如讨论边界、角色口吻或本轮目标。"></textarea>
                                    <div class="desktop-workshop-contract-actions">
                                        <button class="desktop-secondary-action" type="button" data-workshop-contract-close>收起</button>
                                        <button class="desktop-primary-action" type="button" data-workshop-contract-save>保存</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>
                    <div class="desktop-workshop-thread">
                        <div class="desktop-workshop-messages" data-workshop-messages></div>
                        <div class="desktop-workshop-empty-state" data-workshop-empty hidden>
                            <div class="desktop-workshop-empty-content" data-workshop-empty-content></div>
                        </div>
                    </div>
                    <div class="desktop-workshop-convert-bar" data-workshop-output-actions hidden>
                        <span class="desktop-workshop-convert-bar-label">将这条回复</span>
                        <button class="desktop-workshop-convert-action" type="button" data-workshop-to-compendium disabled>转资料</button>
                        <button class="desktop-workshop-convert-action" type="button" data-workshop-to-summary disabled>作摘要</button>
                        <button class="desktop-workshop-convert-action" type="button" data-workshop-insert-draft disabled>插入正文</button>
                    </div>
                    <div class="desktop-workshop-composer">
                        <div class="desktop-workshop-input-row">
                            <textarea data-workshop-input placeholder="想清楚再写。可用 @[资料] 或 #[场景] 引用上下文。"></textarea>
                            <button class="desktop-primary-action" type="button" data-workshop-send>发送</button>
                        </div>
                    </div>
                </section>
            </section>
