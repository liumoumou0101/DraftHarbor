            <section class="desktop-view desktop-recovery-view" data-view-panel="recovery">
                <section class="desktop-recovery-list-panel">
                    <div class="desktop-recovery-sidebar-head">
                        <strong data-recovery-status aria-live="polite">正在读取本地备份…</strong>
                        <span data-recovery-location>正在读取备份位置…</span>
                    </div>
                    <div class="desktop-recovery-toolbar">
                        <input type="text" data-recovery-search placeholder="搜索项目、备注、原因" autocomplete="off">
                        <div class="desktop-recovery-filter-row">
                            <div class="desktop-recovery-filter-chips" data-recovery-filter-chips role="tablist" aria-label="备份筛选">
                                <button type="button" class="is-active" data-recovery-filter-chip="all" role="tab" aria-selected="true">全部</button>
                                <button type="button" data-recovery-filter-chip="ok" role="tab" aria-selected="false">健康</button>
                                <button type="button" data-recovery-filter-chip="invalid" role="tab" aria-selected="false">异常</button>
                                <button type="button" data-recovery-filter-chip="pinned" role="tab" aria-selected="false">已固定</button>
                            </div>
                            <button class="desktop-secondary-action" type="button" data-refresh-recovery>刷新</button>
                        </div>
                        <select data-recovery-filter hidden>
                            <option value="all">全部备份</option>
                            <option value="ok">健康</option>
                            <option value="invalid">异常</option>
                            <option value="pinned">已固定</option>
                        </select>
                    </div>
                    <div class="desktop-recovery-list" data-recovery-list></div>
                </section>
                <aside class="desktop-recovery-preview" data-recovery-preview>
                    <div class="desktop-recovery-preview-heading">
                        <div>
                            <h3 data-recovery-preview-title>选择一个备份</h3>
                            <p data-recovery-preview-meta>从左侧列表选一条，预览正文和差异后再动手。</p>
                        </div>
                        <span class="desktop-recovery-health" data-recovery-preview-health>等待选择</span>
                    </div>
                    <div class="desktop-recovery-diff" data-recovery-diff></div>
                    <p class="desktop-recovery-content-label">正文预览</p>
                    <div class="desktop-recovery-preview-text" data-recovery-preview-text></div>
                    <div class="desktop-recovery-actions">
                        <section class="desktop-recovery-safe-actions">
                            <div>
                                <strong>安全恢复</strong>
                                <span>推荐先恢复为副本，不影响现有项目。</span>
                            </div>
                            <div>
                                <button class="desktop-secondary-action" type="button" data-recovery-restore-scene disabled>只恢复这一场</button>
                                <button class="desktop-primary-action" type="button" data-recovery-restore-new disabled>恢复为新项目</button>
                            </div>
                        </section>
                        <section class="desktop-recovery-danger-zone">
                            <div>
                                <strong>替换原项目</strong>
                                <span>会覆盖当前项目；操作前自动保存保护快照。</span>
                            </div>
                            <button class="desktop-danger-action" type="button" data-recovery-restore-replace disabled>替换原项目</button>
                        </section>
                    </div>
                </aside>
            </section>
