            <header class="desktop-topbar">
                <div>
                    <p class="desktop-eyebrow">本地优先 AI 小说工作台</p>
                    <h1 id="desktop-view-title">书库</h1>
                </div>
                <div class="desktop-topbar-actions">
                    <button class="desktop-secondary-action" type="button" data-toggle-rail>隐藏导航</button>
                    <button class="desktop-icon-action" type="button" data-toggle-fullscreen title="切换全屏" aria-label="切换全屏">⛶</button>
                    <button class="desktop-secondary-action" type="button" data-view-target="writer">写作页</button>
                </div>
            </header>
            <div class="desktop-context-strip" data-context-strip hidden>
                <div class="desktop-context-strip-info">
                    <span data-context-project-title></span>
                    <span data-context-scene-title></span>
                    <span data-context-word-count></span>
                    <span data-context-compendium-summary></span>
                </div>
                <div class="desktop-context-strip-actions">
                    <button class="desktop-context-action" data-context-goto-writer>写作</button>
                    <button class="desktop-context-action" data-context-goto-compendium>资料</button>
                    <button class="desktop-context-action" data-context-goto-workshop>讨论</button>
                    <button class="desktop-secondary-action" data-context-goto-bookshelf hidden>返回书库</button>
                </div>
            </div>
