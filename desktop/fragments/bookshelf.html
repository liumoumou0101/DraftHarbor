            <section class="desktop-view desktop-view-bookshelf is-active" data-view-panel="bookshelf">
                <div class="desktop-bookshelf">
                    <header class="desktop-bookshelf-header">
                        <div class="desktop-bookshelf-heading">
                            <p class="desktop-section-kicker">作品</p>
                            <h2>书库</h2>
                            <p class="desktop-library-count" data-project-library-count>—</p>
                        </div>
                        <div class="desktop-bookshelf-toolbar" aria-label="书库操作">
                            <input type="search" data-project-search placeholder="搜索书名或文件名">
                            <select data-project-sort aria-label="项目排序">
                                <option value="recent">最近保存</option>
                                <option value="name">书名</option>
                                <option value="words">字数</option>
                                <option value="chapters">章节数</option>
                            </select>
                            <button class="desktop-primary-action" type="button" data-open-new-project>新建作品</button>
                            <div class="desktop-bookshelf-more-wrap" data-bookshelf-more-wrap>
                                <button class="desktop-secondary-action" type="button" data-bookshelf-more aria-haspopup="true" aria-expanded="false">维护</button>
                                <div class="desktop-bookshelf-more-menu" data-bookshelf-more-menu hidden role="menu" aria-label="书库维护">
                                    <button type="button" role="menuitem" data-import-project-snapshot>导入旧 JSON</button>
                                    <button type="button" role="menuitem" data-import-project-package>导入项目包</button>
                                    <button type="button" role="menuitem" data-import-writingway1>导入 W1 文件夹</button>
                                    <button type="button" role="menuitem" data-refresh-projects>刷新书库</button>
                                    <button type="button" role="menuitem" data-open-project-folder>打开项目目录</button>
                                </div>
                            </div>
                        </div>
                    </header>
                    <p class="desktop-library-meta" data-project-library-meta>正在读取本地书库...</p>
                    <div class="desktop-library-status" data-project-library-status>正在读取项目...</div>
                    <div class="desktop-project-grid" data-project-grid></div>
                    <div class="desktop-shelf-status" data-project-library-meta-secondary></div>
                    <input type="file" data-import-project-snapshot-file accept="application/json,.json" hidden>
                    <input type="file" data-import-project-package-file accept=".zip,.draftharbor-project.zip,.writingway-project.zip,application/zip" hidden>
                    <input type="file" data-import-writingway1-files webkitdirectory directory multiple hidden>
                </div>
            </section>
